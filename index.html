<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alcopa — carnet d'acheteur</title>
<style>
  :root{
    --bg:#ffffff; --panel:#f6f4f0; --soft:#f5f7f9; --ink:#1c1e21; --mut:#6b7178; --line:#e6e9ec;
    --accent:#1f6feb; --green:#1a7f37; --gsoft:#e7f5ec; --blue:#1f6feb; --bsoft:#e7f0fd;
    --amber:#9a6700; --asoft:#fbefd8; --red:#c1272d; --rsoft:#fbe6e6; --grey:#5b636b; --gr-soft:#eef0f2;
    --mono:ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 70px}
  a{color:var(--accent)}
  h1{font-size:22px;margin:0 0 3px;letter-spacing:-.01em}
  h2{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .count{font-size:12px;font-weight:600;color:var(--mut);background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
  .updated{color:var(--mut);font-size:13px;margin:0 0 16px}
  /* stats */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 26px}
  .stat{flex:1;min-width:120px;background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:12px 14px}
  .stat b{font-size:26px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat span{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  section{margin:0 0 34px}
  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .card{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
  .card .ph{aspect-ratio:16/10;background:var(--soft);overflow:hidden}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .card .bd{padding:11px 13px;display:flex;flex-direction:column;gap:7px}
  .nm{font-weight:650;font-size:14px;line-height:1.25}
  .sub{font-size:12px;color:var(--mut)}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap}
  .prices{display:flex;gap:12px;font-size:12.5px;flex-wrap:wrap}
  .prices .k{color:var(--mut)}
  .btn{margin-top:2px;display:inline-block;text-align:center;font-size:12px;font-weight:600;text-decoration:none;
       border:1px solid var(--line);border-radius:7px;padding:7px 10px;color:var(--ink);background:var(--soft)}
  .btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  /* semantic colors */
  .v-PÉPITE{background:var(--gsoft);color:var(--green)} .v-BON{background:var(--bsoft);color:var(--blue)}
  .v-MOYEN{background:var(--asoft);color:var(--amber)} .v-PASS{background:var(--gr-soft);color:var(--grey)}
  .e-ok{background:var(--gsoft);color:var(--green)} .e-tilde{background:var(--asoft);color:var(--amber)}
  .e-q{background:var(--gr-soft);color:var(--grey)} .e-bad{background:var(--rsoft);color:var(--red)}
  .l-FORT{background:var(--gsoft);color:var(--green)} .l-MOYEN{background:var(--bsoft);color:var(--blue)}
  .l-FAIBLE{background:var(--asoft);color:var(--amber)} .l-x{background:var(--gr-soft);color:var(--grey)}
  .rk-warn{background:var(--asoft);color:var(--amber)} .rk-red{background:var(--rsoft);color:var(--red)} .rk-grey{background:var(--gr-soft);color:var(--grey)}
  .m-pos{color:var(--green);font-weight:700} .m-mid{color:var(--blue);font-weight:700} .m-low{color:var(--amber);font-weight:700} .m-neg{color:var(--red);font-weight:700}
  /* controls */
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .controls input,.controls select{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
  .controls input[type=search]{flex:1;min-width:180px}
  .rescount{font-size:12.5px;color:var(--mut);margin-left:auto}
  .chk{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .chk input{margin:0}
  /* table */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:11px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{position:sticky;top:0;background:var(--panel);text-align:left;padding:9px 8px;font-size:11.5px;
           text-transform:uppercase;letter-spacing:.03em;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
  th.s{cursor:pointer;user-select:none}
  th.s:hover{color:var(--ink)}
  th.s[aria-sort=ascending]::after{content:" ↑";color:var(--accent)}
  th.s[aria-sort=descending]::after{content:" ↓";color:var(--accent)}
  th.s[aria-sort=none]::after{content:" ⇅";color:#bbb}
  th.s:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  tbody td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:var(--soft)}
  .tthumb{width:46px;height:34px;object-fit:cover;border-radius:4px;background:var(--soft);display:block}
  .tname{font-weight:600}.tname a{color:inherit;text-decoration:none}.tname a:hover{color:var(--accent)}
  .tsub{font-size:11.5px;color:var(--mut)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .lk{color:var(--accent);text-decoration:none;font-weight:700}
  .empty{padding:26px;text-align:center;color:var(--mut)}
  @media(max-width:720px){
    .col-mkt,.col-mise,.col-loc{display:none}
    .stat b{font-size:22px}
    thead th,tbody td{padding:7px 6px}
  }
  @media print{.controls{display:none}.tw{overflow:visible}.btn{display:none}}
</style>
</head>

<div class="wrap">

    <p class="updated">Mis à jour le <span id="upd">—</span></p>
    <div class="stats" id="stats"></div>
  </header>

  <section id="today-sec" hidden>

    <div class="grid" id="today"></div>

  <section>
    <h2><span aria-hidden="true">🎯</span> À miser <span class="count" id="picks-count"></span></h2>
    <div class="controls">
      <input type="search" id="pq" placeholder="Rechercher un deal…" aria-label="Rechercher un deal">
      <select id="p-sort" aria-label="Trier les deals">
        <option value="verdict">Tri : PÉPITE d'abord</option>
        <option value="margin">Marge la + haute</option>
        <option value="mise">Moins cher (mise)</option>
        <option value="loc">Meilleure location</option>
        <option value="saledt">Vente la + proche</option>
      </select>
      <select id="p-verdict" aria-label="Filtrer par verdict">
        <option value="">Tout verdict</option><option>PÉPITE</option><option>BON PLAN</option>
      </select>
      <select id="p-loc" aria-label="Filtrer par location">
        <option value="">Toute location</option><option>FORT</option><option>MOYEN</option><option>FAIBLE</option>
      </select>
      <select id="p-budget" aria-label="Budget mise max">
        <option value="">Tout budget</option><option value="5000">Mise ≤ 5 000 €</option>
        <option value="8000">Mise ≤ 8 000 €</option><option value="12000">Mise ≤ 12 000 €</option>
      </select>
      <select id="p-eng" aria-label="Filtrer par moteur">
        <option value="">Tout moteur</option><option value="✅">✅ fiable</option><option value="~">~ correct</option>
      </select>
      <label class="chk"><input type="checkbox" id="p-clean"> sans risque</label>
      <span class="rescount" id="picks-rescount"></span>
    </div>
    <div class="grid" id="picks"></div>
  </section>

  <section>
    <h2><span aria-hidden="true">📋</span> Inventaire complet <span class="count" id="inv-total"></span></h2>
    <div class="controls">
      <input type="search" id="q" placeholder="Rechercher une voiture…" aria-label="Rechercher">
      <select id="f-sale" aria-label="Filtrer par vente"></select>
      <select id="f-period" aria-label="Filtrer par période">
        <option value="">Toutes dates</option><option value="1">Aujourd'hui</option>
        <option value="2">48 h</option><option value="7">Cette semaine</option>
      </select>
      <select id="f-verdict" aria-label="Filtrer par verdict">
        <option value="">Tout verdict</option><option>PÉPITE</option><option>BON PLAN</option><option>MOYEN</option>
      </select>
      <select id="f-eng" aria-label="Filtrer par fiabilité moteur">
        <option value="">Tout moteur</option><option value="✅">✅ fiable</option><option value="~">~ correct</option>
        <option value="?">? à vérifier</option><option value="bad">⛔ fragile</option>
      </select>
      <select id="f-loc" aria-label="Filtrer par location">
        <option value="">Toute location</option><option>FORT</option><option>MOYEN</option><option>FAIBLE</option>
      </select>
      <select id="f-ct" aria-label="Filtrer par contrôle technique">
        <option value="">Tout CT</option><option value="FAVORABLE">CT favorable</option>
        <option value="DEFAVORABLE">CT défavorable</option><option value="none">CT non lu</option>
      </select>
      <span class="rescount" id="rescount"></span>
    </div>
    <div class="tw">
      <table>
        <thead><tr>
          <th>Photo</th>
          <th class="s" data-k="name" aria-sort="none" tabindex="0" role="button">Voiture</th>
          <th class="s num col-mise" data-k="mise" aria-sort="none" tabindex="0" role="button">Mise</th>
          <th class="s num col-mkt" data-k="market" aria-sort="none" tabindex="0" role="button">Marché</th>
          <th class="s num" data-k="margin" aria-sort="descending" tabindex="0" role="button">Marge</th>
          <th class="s" data-k="verdict" aria-sort="none" tabindex="0" role="button">Verdict</th>
          <th>Moteur</th>
          <th class="col-loc">Loc.</th>
          <th class="s" data-k="saledt" aria-sort="none" tabindex="0" role="button">Vente</th>
          <th>Lien</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </section>
  <p class="updated" style="margin-top:20px">Prix : marge = marché − tout-compris (frais Alcopa + réparations CT). Vérifier chaque voiture avant d'enchérir · données à titre indicatif.</p>
</div>

/* ── sécurité ── */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(u){return (typeof u==='string' && /^https?:\/\//i.test(u)) ? u : '';}

/* ── helpers d'affichage ── */
function eur(n){return (n==null||isNaN(n))?'—':Number(n).toLocaleString('fr-FR')+' €';}
function pct(n){return (n==null||isNaN(n))?'—':(n>0?'+':'')+n+' %';}
function marginCls(m){if(m==null)return '';if(m>=30)return 'm-pos';if(m>=15)return 'm-mid';if(m>0)return 'm-low';return 'm-neg';}

function engCls(t){return t==='✅'?'e-ok':t==='~'?'e-tilde':(t==='⛔'||t==='⚠️')?'e-bad':'e-q';}
function locCls(l){return ['FORT','MOYEN','FAIBLE'].includes(l)?('l-'+l):'l-x';}
function parseDt(s){if(!s)return null;const m=/^(\d{2})-(\d{2})-(\d{4}) (\d{2}):(\d{2})/.exec(s);return m?new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]):null;}
const NOW=new Date();
function relDate(s){const d=parseDt(s);if(!d)return esc((s||'').replace(/ .*/,''));
  const days=Math.floor((d-new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()))/864e5);
  const hm=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  if(days===0)return "Auj. "+hm; if(days===1)return "Demain "+hm;
  if(days>1&&days<7)return d.toLocaleDateString('fr-FR',{weekday:'short'})+' '+hm;
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});}
function riskChips(c){const out=[];
  if(c.suspect)out.push('<span class="chip rk-warn" title="Quasi-neuve à mise très basse = probable véhicule accidenté/VEI">⚠️ prix suspect</span>');
  if(c.ct==='DEFAVORABLE')out.push('<span class="chip rk-red" title="Contrôle technique défavorable'+(c.ct_ocr?' (lu par OCR)':'')+'">🔧 CT défav.'+(c.ct_ocr?'*':'')+'</span>');
  else if(c.ct_empty)out.push('<span class="chip rk-grey" title="CT non lu (scan illisible) — coût réparation inconnu">CT non lu</span>');
  if((c.dmg||0)>=4)out.push('<span class="chip rk-warn" title="Carrosserie abîmée sur plusieurs panneaux">⚠️ carrosserie</span>');
  return out.join('');}

/* ── rendu ── */
function meta(){const m=DATA.meta;document.getElementById('upd').textContent=m.updated;
  document.getElementById('stats').innerHTML=
    stat(m.n_total,'Lots à venir')+stat(m.n_picks,'Bons deals')+stat(m.n_today,"Nouveaux aujourd'hui");
  document.getElementById('inv-total').textContent=m.n_total+' lots';}
function stat(v,l){return '<div class="stat"><b>'+v+'</b><span>'+esc(l)+'</span></div>';}

function card(c){const u=safeUrl(c.url),th=safeUrl(c.thumb);
  const ct = c.ct?('<span class="'+(c.ct==='DEFAVORABLE'?'m-neg':'m-pos')+'">'+esc(c.ct)+(c.ct_ocr?'*':'')+'</span>'+(c.ct_lo?' · répa '+eur(c.ct_lo)+'–'+eur(c.ct_hi):'')):(c.ct_empty?'<span class="sub">CT non lu</span>':'');
  return '<div class="card">'+
    (th?'<div class="ph"><img loading="lazy" alt="'+esc(c.name)+'" src="'+esc(th)+'" onerror="this.parentNode.style.display=\'none\'"></div>':'')+
    '<div class="bd">'+
      '<div class="nm">'+esc(c.name)+'</div>'+
      '<div class="sub">'+esc(c.year||'?')+' · '+(c.km!=null?Number(c.km).toLocaleString('fr-FR')+' km':'? km')+'</div>'+
      '<div class="chips"><span class="chip '+verdictCls(c.verdict)+'">'+esc(c.verdict||'?')+'</span>'+
        '<span class="chip '+engCls(c.etag)+'">'+esc(c.etag+' '+c.engine)+'</span>'+
        (c.loc?'<span class="chip '+locCls(c.loc)+'">📍 '+esc(c.loc)+(c.locp?' '+c.locp+'€':'')+'</span>':'')+riskChips(c)+'</div>'+
      '<div class="prices"><span><span class="k">mise</span> '+eur(c.mise)+'</span>'+
        '<span><span class="k">marché</span> '+eur(c.market)+'</span>'+
        '<span><span class="k">marge</span> <b class="'+marginCls(c.margin)+'">'+pct(c.margin)+'</b></span></div>'+
      '<div class="sub">'+ct+'</div>'+
      '<div class="sub">📅 '+esc(c.sale||'—')+'</div>'+
      (u?'<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">Voir sur Alcopa ↗</a>':'')+
    '</div></div>';}

/* ── inventaire filtrable/triable ── */
let sortK='margin', sortDir=-1;
function fillSaleFilter(){const s=new Set(DATA.inv.map(c=>c.sale).filter(Boolean));
  const sel=document.getElementById('f-sale');
  const all=document.createElement('option');all.value='';all.textContent='Toutes les ventes';sel.appendChild(all);
  [...s].sort((a,b)=>(parseDt(DATA.inv.find(c=>c.sale===a).sale_dt)||0)-(parseDt(DATA.inv.find(c=>c.sale===b).sale_dt)||0))
    .forEach(v=>{const o=document.createElement('option');o.textContent=v;sel.appendChild(o);});}
function getFilters(){return{
  q:(document.getElementById('q').value||'').toLowerCase().trim(),
  sale:document.getElementById('f-sale').value, period:document.getElementById('f-period').value,
  verdict:document.getElementById('f-verdict').value, eng:document.getElementById('f-eng').value,
  loc:document.getElementById('f-loc').value, ct:document.getElementById('f-ct').value};}
function match(c,f){
  if(f.q && !(c.name||'').toLowerCase().includes(f.q))return false;
  if(f.sale && c.sale!==f.sale)return false;
  if(f.verdict && c.verdict!==f.verdict)return false;
  if(f.eng){if(f.eng==='bad'){if(c.etag!=='⛔'&&c.etag!=='⚠️')return false;}else if(c.etag!==f.eng)return false;}
  if(f.loc && c.loc!==f.loc)return false;
  if(f.ct){if(f.ct==='none'){if(c.ct)return false;}else if(c.ct!==f.ct)return false;}
  if(f.period){const d=parseDt(c.sale_dt);if(!d)return false;
    const days=(d-NOW)/864e5;if(days<-.5)return false;
    if(f.period==='1'&&d.toDateString()!==NOW.toDateString())return false;
    if(f.period==='2'&&days>2)return false; if(f.period==='7'&&days>7)return false;}
  return true;}
function sortVal(c){if(sortK==='name')return (c.name||'').toLowerCase();
  if(sortK==='saledt')return parseDt(c.sale_dt)?parseDt(c.sale_dt).getTime():8e15;
  if(sortK==='verdict')return {'PÉPITE':0,'BON PLAN':1,'MOYEN':2,'PASS':3}[c.verdict]??9;
  const v=c[sortK];return v==null?-Infinity:v;}
function renderTable(){const f=getFilters();
  let rows=DATA.inv.filter(c=>match(c,f));
  rows.sort((a,b)=>{const x=sortVal(a),y=sortVal(b);return (x<y?-1:x>y?1:0)*sortDir;});
  document.getElementById('rescount').textContent=rows.length+' résultat'+(rows.length>1?'s':'');
  const tb=document.getElementById('tb');
  if(!rows.length){tb.innerHTML='<tr><td colspan="10" class="empty">Aucune voiture pour ces filtres.</td></tr>';return;}
  tb.innerHTML=rows.map(c=>{const u=safeUrl(c.url),th=safeUrl(c.thumb);
    return '<tr>'+
      '<td>'+(th?'<img class="tthumb" loading="lazy" alt="" src="'+esc(th)+'" onerror="this.style.visibility=\'hidden\'">':'<div class="tthumb"></div>')+'</td>'+
      '<td class="tname">'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">':'')+esc(c.name)+(u?'</a>':'')+
        '<div class="tsub">'+esc(c.year||'?')+' · '+(c.km!=null?Number(c.km).toLocaleString('fr-FR')+' km':'?')+'</div>'+
        (riskChips(c)?'<div class="chips" style="margin-top:3px">'+riskChips(c)+'</div>':'')+'</td>'+
      '<td class="num col-mise">'+eur(c.mise)+'</td>'+
      '<td class="num col-mkt">'+eur(c.market)+'</td>'+
      '<td class="num"><b class="'+marginCls(c.margin)+'">'+pct(c.margin)+'</b></td>'+
      '<td><span class="chip '+verdictCls(c.verdict)+'">'+esc(c.verdict||'?')+'</span></td>'+
      '<td><span class="chip '+engCls(c.etag)+'">'+esc(c.etag)+'</span> <span class="tsub">'+esc(c.engine)+'</span></td>'+
      '<td class="col-loc">'+(c.loc?'<span class="chip '+locCls(c.loc)+'">'+esc(c.loc)+'</span>':'—')+'</td>'+
      '<td class="tsub">'+relDate(c.sale_dt||c.sale)+'</td>'+
      '<td>'+(u?'<a class="lk" href="'+esc(u)+'" target="_blank" rel="noopener" title="Voir sur Alcopa">↗</a>':'—')+'</td>'+
    '</tr>';}).join('');}
function wire(){
  ['q','f-sale','f-period','f-verdict','f-eng','f-loc','f-ct'].forEach(id=>{
    const el=document.getElementById(id);el.addEventListener(el.tagName==='INPUT'?'input':'change',renderTable);});
  document.querySelectorAll('th.s').forEach(th=>{
    const act=()=>{const k=th.dataset.k;
      if(sortK===k)sortDir=-sortDir;else{sortK=k;sortDir=(k==='name'||k==='verdict')?1:-1;}
      document.querySelectorAll('th.s').forEach(t=>t.setAttribute('aria-sort','none'));
      th.setAttribute('aria-sort',sortDir===1?'ascending':'descending');renderTable();};
    th.addEventListener('click',act);
    th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});});}

meta();
if(DATA.today.length){document.getElementById('today-sec').hidden=false;
  document.getElementById('today-count').textContent=DATA.today.length;
  document.getElementById('today').innerHTML=DATA.today.map(card).join('');}
/* ── À miser : filtrable / triable ── */
function pickState(){return{
  q:(document.getElementById('pq').value||'').toLowerCase().trim(),
  sort:document.getElementById('p-sort').value,
  verdict:document.getElementById('p-verdict').value,
  loc:document.getElementById('p-loc').value,
  budget:document.getElementById('p-budget').value,
  eng:document.getElementById('p-eng').value,
  clean:document.getElementById('p-clean').checked};}
function pickKey(c,k){
  if(k==='margin')return -(c.margin==null?-1e9:c.margin);
  if(k==='mise')return c.mise==null?1e12:c.mise;
  if(k==='loc')return {FORT:0,MOYEN:1,FAIBLE:2}[c.loc]??3;
  if(k==='saledt'){const d=parseDt(c.sale_dt);return d?d.getTime():8e15;}
  return {'PÉPITE':0,'BON PLAN':1,'MOYEN':2}[c.verdict]??3;}
function renderPicks(){const f=pickState();
  let rows=DATA.picks.filter(c=>{
    if(f.q && !(c.name||'').toLowerCase().includes(f.q))return false;
    if(f.verdict && c.verdict!==f.verdict)return false;
    if(f.loc && c.loc!==f.loc)return false;
    if(f.eng && c.etag!==f.eng)return false;
    if(f.budget && (c.mise==null || c.mise>+f.budget))return false;
    if(f.clean && (c.ct==='DEFAVORABLE'||c.ct_empty||(c.dmg||0)>=4||c.suspect))return false;
    return true;});
  rows.sort((a,b)=>{const x=pickKey(a,f.sort),y=pickKey(b,f.sort);
    if(x<y)return -1; if(x>y)return 1;
    const va={'PÉPITE':0,'BON PLAN':1}[a.verdict]??2, vb={'PÉPITE':0,'BON PLAN':1}[b.verdict]??2;
    if(va!==vb)return va-vb; return (b.margin||0)-(a.margin||0);});
  document.getElementById('picks-rescount').textContent=rows.length+' deal'+(rows.length>1?'s':'');
  document.getElementById('picks').innerHTML=rows.length?rows.map(card).join(''):'<p class="empty">Aucun deal pour ces filtres.</p>';}
function wirePicks(){
  document.getElementById('pq').addEventListener('input',renderPicks);
  ['p-sort','p-verdict','p-loc','p-budget','p-eng','p-clean'].forEach(id=>
    document.getElementById(id).addEventListener('change',renderPicks));}
document.getElementById('picks-count').textContent=DATA.meta.n_picks+' deals';
wirePicks(); renderPicks();
fillSaleFilter(); wire(); renderTable();
</script>
</body>
</html>
